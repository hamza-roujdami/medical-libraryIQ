[project]
name = "libraryiq"
version = "0.1.0"
description = "Librarian-assisting agent: find an article, check access, raise a request."
requires-python = ">=3.13"
dependencies = [
    "agent-framework-core==1.21.0",
    "agent-framework-openai==1.16.0",
    "agent-framework-foundry-hosting==1.0.0b261008",
    "httpx>=0.28,<1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "agent-framework-devui==1.0.0b261002",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libraryiq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
